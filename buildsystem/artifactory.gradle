ext {
    CONTEXT_URL = "https://seatcode.jfrog.io/artifactory"
    GROUP_ID = "seat.code.android"
    VERSION_NAME = "3.5.5"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = GROUP_ID
            version = VERSION_NAME
        }
    }
    if (project.hasProperty('artifact_url')) {
        repositories {
            maven {
                url = artifact_url
                credentials {
                    username = project.findProperty('artifact_user_name') ?: ""
                    password = project.hasProperty('artifact_password_command') ? artifact_password_command.execute().text.trim() : ""
                }
            }
        }
    }
}
